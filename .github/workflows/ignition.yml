# Core is private, so it is checked out with MONOREPO_PAT. Builds the Ignition image and runs the real-Frappe integration test
# (MariaDB and Redis as services). Not yet run anywhere: first run may need
# small fixes to the Frappe setup steps.
name: Ignition (real Frappe)

on:
  workflow_dispatch:
    inputs:
      core-ref:
        type: string
        default: main
        description: "RokctAI/core ref that holds Ignition"
  pull_request:
    paths:
      - ".github/workflows/ignition.yml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/core
          ref: ${{ inputs.core-ref || 'main' }}
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: core
      - run: cd core && docker build -f docker/ignition/Dockerfile -t ignition .
      - name: Image starts and reports status
        run: docker run --rm ignition --help

  real-frappe:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      IGNITION_IT_ROOT: ${{ github.workspace }}/it-root
      IGNITION_DB_ROOT_PASSWORD: root
      IGNITION_ADMIN_PASSWORD: admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/core
          ref: ${{ inputs.core-ref || 'main' }}
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config mariadb-client
      - name: Prepare root with Frappe v16
        run: |
          mkdir -p "$IGNITION_IT_ROOT/apps" "$IGNITION_IT_ROOT/sites"
          git clone --depth 1 --branch version-16-hotfix https://github.com/frappe/frappe "$IGNITION_IT_ROOT/apps/frappe"
          pip install -e "$IGNITION_IT_ROOT/apps/frappe"
          echo frappe > "$IGNITION_IT_ROOT/sites/apps.txt"
          cat > "$IGNITION_IT_ROOT/sites/common_site_config.json" <<'JSON'
          {"db_host": "127.0.0.1", "redis_cache": "redis://127.0.0.1:6379",
           "redis_queue": "redis://127.0.0.1:6379", "redis_socketio": "redis://127.0.0.1:6379"}
          JSON
      - name: Ignition requirements
        run: pip install -r core/pulsar/pulsar/requirements.txt -r core/pulsar/pulsar/requirements-extras.txt
      - name: Unit tests
        working-directory: core/pulsar
        run: python -m unittest tests.test_ignition tests.test_ignition_backup -v
      - name: Real Frappe integration test
        working-directory: core/pulsar
        run: python -m unittest tests.test_ignition_integration -v
