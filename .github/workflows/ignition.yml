# Core is private, so it is checked out with MONOREPO_PAT. Builds the Ignition image and runs the real-Frappe integration test
# (MariaDB and Redis as services). Not yet run anywhere: first run may need
# small fixes to the Frappe setup steps.
name: Ignition (real Frappe)

on:
  workflow_dispatch:
    inputs:
      core-ref:
        type: string
        default: main
        description: "RokctAI/core ref that holds Ignition"
      protocol-ref:
        type: string
        default: main
        description: "The-Rokct-Protocol ref for the rokctapp compose (pin a SHA for a release)"
      rcore-ref:
        type: string
        default: main
        description: "rcore shell ref for the rokctapp compose"
  pull_request:
    paths:
      - ".github/workflows/ignition.yml"
      - "platform/ignition.Dockerfile"
      - "platform/ignition/**"
      - "platform/scripts/build_ignition_root.sh"
      - "platform/scripts/build_ignition_image.sh"
      - "platform/scripts/compose_product.py"
      - "platform/scripts/patch_frappe_v16.py"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/core
          ref: ${{ inputs.core-ref || 'main' }}
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: core
          persist-credentials: false
      - run: cd core && docker build -f docker/ignition/Dockerfile -t ignition .
      - name: Image starts and reports status
        run: docker run --rm ignition --help
      - name: bench wrapper works inside the image
        run: |
          set -eu
          out=$(docker run --rm --entrypoint bench ignition status 2>&1)
          echo "$out"
          echo "$out" | grep -q "ran as: ignition status"
          if docker run --rm --entrypoint bench ignition get-app x >/dev/null 2>refused.txt; then
            echo "get-app should be refused"; exit 1
          fi
          cat refused.txt
          grep -q "does not have" refused.txt

  real-frappe:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      IGNITION_IT_ROOT: ${{ github.workspace }}/it-root
      IGNITION_DB_ROOT_PASSWORD: root
      IGNITION_ADMIN_PASSWORD: admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/core
          ref: ${{ inputs.core-ref || 'main' }}
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config mariadb-client
      - name: Ignition requirements
        run: pip install -r core/pulsar/pulsar/requirements.txt -r core/pulsar/pulsar/requirements-extras.txt
      - name: Unit tests (run before Frappe is installed, they assert it is absent)
        working-directory: core/pulsar
        run: python -m unittest tests.test_ignition tests.test_ignition_backup -v
      - name: Prepare root with Frappe v16
        run: |
          mkdir -p "$IGNITION_IT_ROOT/apps" "$IGNITION_IT_ROOT/sites"
          git clone --depth 1 --branch version-16-hotfix https://github.com/frappe/frappe "$IGNITION_IT_ROOT/apps/frappe"
          pip install -e "$IGNITION_IT_ROOT/apps/frappe"
          echo frappe > "$IGNITION_IT_ROOT/sites/apps.txt"
          cat > "$IGNITION_IT_ROOT/sites/common_site_config.json" <<'JSON'
          {"db_host": "127.0.0.1", "redis_cache": "redis://127.0.0.1:6379",
           "redis_queue": "redis://127.0.0.1:6379", "redis_socketio": "redis://127.0.0.1:6379"}
          JSON
      - name: Real Frappe integration test
        working-directory: core/pulsar
        run: python -m unittest tests.test_ignition_integration -v
      - name: Drive the real CLI, as a person would
        working-directory: core/pulsar
        env:
          IGNITION_ROOT: ${{ github.workspace }}/it-root
        run: |
          set -eux
          ign() { python -m pulsar.ignition "$@"; }
          SITE=cli-site.localhost
          ign new-site "$SITE" --persona it-persona
          ign migrate "$SITE"
          STAMP=$(ign backup "$SITE" | tail -n 1)
          echo "backup set: $STAMP"
          ign serve --detach --port 8000
          ign worker --detach
          ign scheduler --detach
          sleep 15
          ign status
          curl -fsS -H "Host: $SITE" http://127.0.0.1:8000/api/method/ping
          ign stop web
          ign stop worker
          ign stop scheduler
          ign status
          ign restore "$SITE" "$(basename "$STAMP")" --persona it-persona --force
          ign migrate "$SITE"
          ign prune "$SITE" --keep 1

  # Ignition + Frappe v16 + composed rokctapp (rcore, 12 modules) in one image
  # (platform/ignition.Dockerfile). Build and smoke test only: no DB or Redis
  # here; the stack file and the real-stack run are later steps.
  rokctapp-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/core
          ref: ${{ inputs.core-ref || 'main' }}
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: .ignition-core
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test ignition_rokctapp
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
          PROTOCOL_REF: ${{ inputs.protocol-ref || 'main' }}
          RCORE_REF: ${{ inputs.rcore-ref || 'main' }}
        run: |
          platform/scripts/build_ignition_image.sh \
            --core .ignition-core \
            --tag ignition-rokctapp:ci \
            --protocol-ref "$PROTOCOL_REF" \
            --rcore-ref "$RCORE_REF"
      - name: Build provenance
        run: docker run --rm --entrypoint cat ignition-rokctapp:ci /opt/ignition/ignition_build.json
