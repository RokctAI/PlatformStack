name: Auto Merge

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@dd18f9dee1976728aea6156fc6efbf2951d1bc75 # main
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, RendaniSinyage, rokctbot, rokctbot[bot]'
    secrets: inherit
