name: Auto Merge

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@2c7f49674dc9c14ca390f3342ad514cff59f64f5 # main
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, RendaniSinyage, rokctbot, rokctbot[bot]'
    secrets: inherit
