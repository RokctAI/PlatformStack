name: Auto Merge

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@0baa82d350e5ad1bc8d3950c1417c320fd347c7b # main
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, RendaniSinyage, rokctbot, rokctbot[bot]'
    secrets: inherit
