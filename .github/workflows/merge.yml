name: Auto Merge

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@c9acb66a7449b7ecaef6c909fbf8b0f899464ac5 # main
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, RendaniSinyage, rokctbot, rokctbot[bot]'
    secrets: inherit
