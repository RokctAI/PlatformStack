name: Build (Smart)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM UTC
  workflow_dispatch:
    inputs:
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"

      build-type:
        description: 'Build Type (apk/appbundle) - Ignored for Node'
        required: true
        default: 'apk'
        type: choice
        options:
        - apk
        - appbundle
      node-version:
        type: string
        default: '24'
      python-version:
        type: string
        default: '3.14.2'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '16'
      install-rpanel:
        type: boolean
        default: false
      db-type:
        type: string
        default: 'postgres'
      version_format:
        type: string
        default: '##.##.#'
        description: "Format for version bumping (e.g. ##.##.## or ##.##.#)"
      composed-product:
        type: string
        default: ''
        description: "OPT-IN: build the composed per-product tenant image from this protocol compose template (e.g. rcore). Empty = skip (default)."
      protocol-ref:
        type: string
        default: 'main'
        description: "The-Rokct-Protocol ref for the composed hub (rokcthub) and composed tenant builds (pin a commit SHA for reproducible builds)"

jobs:
  # --- 1. DETECT PROJECT TYPE & UPSTREAM UPDATES ---
  detect:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    outputs:
      is_flutter: ${{ steps.check.outputs.is_flutter }}
      is_node: ${{ steps.check.outputs.is_node }}
      should_build: ${{ steps.upstream_check.outputs.should_build }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git curl jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Check Upstream Updates (Cron Only)
        id: upstream_check
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os, json, urllib.request, base64

          token = os.environ.get('GITHUB_TOKEN')
          headers = {'Accept': 'application/vnd.github.v3+json'}
          if token: headers['Authorization'] = f'token {token}'

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except Exception as e:
                  print(f'Error fetching {url}: {e}')
                  return None

          mv_data = fetch('https://api.github.com/repos/RokctAI/control/contents/control/control/major_versions.json')
          if not mv_data:
              print('Failed to fetch major_versions.json. Forcing build.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('should_build=true\n')
              exit(0)

          mv_json = json.loads(base64.b64decode(mv_data['content']).decode())

          local_state = {}
          if os.path.exists('build_state.json'):
              with open('build_state.json', 'r') as f:
                  local_state = json.load(f)

          should_build = False
          if os.environ.get('GITHUB_EVENT_NAME') != 'schedule':
              should_build = True

          for app, config in mv_json.items():
              repo = f\"{config.get('owner')}/{app}\"
              if 'rok' in repo.lower() and 'rokct' not in repo.lower(): continue
              
              branch = config.get('branch')
              current_val = None
              
              if branch:
                  print(f'Checking latest commit on {repo}:{branch}...')
                  res = fetch(f'https://api.github.com/repos/{repo}/commits/{branch}')
                  if res and 'sha' in res: current_val = res['sha']
              else:
                  print(f'Checking latest tag on {repo}...')
                  res = fetch(f'https://api.github.com/repos/{repo}/tags')
                  if res and len(res) > 0 and 'name' in res[0]: current_val = res[0]['name']
                      
              if current_val and local_state.get(repo) != current_val:
                  print(f'-> UPDATE DETECTED for {repo}! Local: {local_state.get(repo)} Remote: {current_val}')
                  should_build = True

          print('Checking PlatformStack...')
          res = fetch('https://api.github.com/repos/RokctAI/PlatformStack/commits/main')
          if res and 'sha' in res and local_state.get('RokctAI/PlatformStack') != res['sha']:
              print('-> UPDATE DETECTED for PlatformStack!')
              should_build = True

          print('Checking Control Repo...')
          res = fetch('https://api.github.com/repos/RokctAI/control/commits/main')
          if res and 'sha' in res and local_state.get('RokctAI/control') != res['sha']:
              print('-> UPDATE DETECTED for Control!')
              should_build = True

          with open('build_result.txt', 'w') as f:
              f.write(str(should_build).lower())
          "
          
          # Read the python output file and pass it safely to GitHub Actions
          RES=$(cat build_result.txt)
          echo "should_build=$RES" >> "$GITHUB_OUTPUT"
          
          if [ "$RES" = "false" ]; then
            echo "No upstream updates found in the last 7 days. Pipeline will safely skip."
          fi

      - name: Check Project Type
        id: check
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          if [ -f "pubspec.yaml" ]; then
             echo "Flutter project detected."
             echo "is_flutter=true" >> "$GITHUB_OUTPUT"
             echo "is_node=false" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
             echo "Node.js project detected."
             echo "is_flutter=false" >> "$GITHUB_OUTPUT"
             echo "is_node=true" >> "$GITHUB_OUTPUT"
          else
             echo "Unknown project type. Assuming Frappe."
             echo "is_flutter=false" >> "$GITHUB_OUTPUT"
             echo "is_node=false" >> "$GITHUB_OUTPUT"
          fi

  # --- 2. UNIFIED PIPELINE (Smart) ---
  pipeline:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-pipeline.yml@a1ed8107168041aa252213ddcfa5279b00697195 # shared-workflows main @ 2026-08-26
    with:
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      project_type: ${{ needs.detect.outputs.is_flutter == 'true' && 'flutter' || (needs.detect.outputs.is_node == 'true' && 'node' || 'frappe') }}
      install-rpanel: true
      # Quality Gate Toggles
      run_security: true
      run_lint: true
      run_ci: false
      # Deployment Configuration (Immediate release on Main)
      release_strategy: 'weekly'
      # Environment configuration
      node-version: ${{ inputs.node-version || '24' }}
      python-version: ${{ inputs.python-version || '3.14.2' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '16' }}
      db-type: 'postgres'
      version_format: ${{ inputs.version_format || '##.##.##' }}
      bootstrap: true
      # --- Credentials ---
      # For Golden Seed generation: Ensures CI DB password matches Occultation .env/production.env
    secrets: inherit

  docker-release:
    needs: pipeline
    if: success() && startsWith(github.repository, 'RokctAI/')
    runs-on: ubuntu-latest
    permissions: write-all
    services:
      db:
        # Use the official public pgvector image instead of our private rpanel-db.
        # rpanel-db is simply postgres:16 + pgvector — pgvector/pgvector:pg16 provides
        # exactly that from Docker Hub with no auth required, breaking the GHCR deadlock.
        # cube + earthdistance are standard postgres built-ins always available.
        image: pgvector/pgvector:pg16
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_USER: postgres
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git rsync
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
           path: docker-context

      - name: Checkout Vector for Overrides
        if: github.repository_owner == 'RokctAI'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RokctAI/vector
          path: docker-context/overrides/vector
          token: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Checkout Gravity Repository
        if: github.repository_owner == 'RokctAI'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RokctAI/gravity
          path: docker-context/gravity
          token: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT }}

      - name: Build Context Staging
        run: |
          # Copy the current repository's code (the code being tested) into the docker context
          # Exclude the docker-context folder itself to avoid recursion
          rsync -a --exclude 'docker-context' . ./docker-context/current_repo/

      - name: Extract Version
        id: meta
        run: |
          if [ -f "docker-context/version.json" ]; then
            VERSION=$(grep -E '"(platform|rpanel)"' docker-context/version.json | head -n 1 | cut -d'"' -f4)
          elif [ -f "docker-context/rpanel/versions.json" ]; then
            VERSION=$(grep '"rpanel"' docker-context/rpanel/versions.json | cut -d'"' -f4)
          else
            VERSION=$(grep "__version__" docker-context/rpanel/__init__.py | cut -d'"' -f2)
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version!"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extract version: $VERSION"

      - name: Confirm Database Readiness
        run: |
          timeout 30s bash -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do echo 'Waiting for PostgreSQL...'; sleep 2; done"

      # --- Pulsar engine images (no bench, no Frappe) ---
      # pulsar-hub / pulsar-tenant / pulsar-supacharge are built from platform/pulsar/Dockerfile on a
      # staged context: RokctAI/core pulsar/ plus every <repo>/<pkg>/pulsar SDK package. Nothing under
      # any frappe/ folder is staged, and the stage script refuses a module that imports frappe.
      - name: Checkout Pulsar sources
        id: pulsar_src
        env:
          GIT_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          set -eu
          mkdir -p pulsar-src
          for r in core control pay corporate zones agent hardware productivity commerce designer Users; do
            git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)" \
              clone -q --depth 1 "https://github.com/RokctAI/$r" "pulsar-src/$r" || { [ "$r" = core ] && exit 1; echo "skip $r"; }
          done
          # the core commit goes into the image (PULSAR_COMMIT) so every error names the code it ran
          echo "core_sha=$(git -C pulsar-src/core rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage Pulsar build context
        run: |
          PULSAR_SRC="$PWD/pulsar-src" PULSAR_STAGE_ONLY="$PWD/pulsar-stage" \
            bash docker-context/platform/scripts/build_pulsar_images.sh

      # The engine is pinned to one sticks-server commit, so its build is cached by that commit and skipped
      # when the pin has not changed. Bump the ref in both places.
      - name: Restore Sticks engine cache
        id: sticks_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sticks-engine-out
          key: sticks-engine-da72af18c5ad74ffbe32bbd5b9c4b3fb007ebbb4

      - name: Build Sticks engine (pinned)
        if: steps.sticks_cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          GIT_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
          STICKS_SERVER_REF: da72af18c5ad74ffbe32bbd5b9c4b3fb007ebbb4
        run: |
          set -eu
          git init -q sticks-server
          git -C sticks-server -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 https://github.com/RokctAI/sticks-server "$STICKS_SERVER_REF"
          git -C sticks-server checkout -q FETCH_HEAD
          # Only /opt/sticks is needed: a local export of the whole stage (node base image, 1.3 GB+) stalled the
          # runner for hours on 2026-11-22. Build to an image and copy that one folder out.
          docker build -f sticks-server/docker/Dockerfile --target engine -t sticks-engine:ci sticks-server
          cid=$(docker create sticks-engine:ci)
          mkdir -p sticks-engine-out/opt
          docker cp "$cid:/opt/sticks" sticks-engine-out/opt/sticks
          docker rm "$cid" >/dev/null
          test -f sticks-engine-out/opt/sticks/build/up/apps/sticks-engine/dist/sticks-engine.mjs

      - name: Save Sticks engine cache
        if: steps.sticks_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sticks-engine-out
          key: sticks-engine-da72af18c5ad74ffbe32bbd5b9c4b3fb007ebbb4

      - name: Build and Push Pulsar Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pulsar-stage
          file: pulsar-stage/Dockerfile
          target: pulsar-hub
          push: true
          tags: |
            ghcr.io/rokctai/occultation/pulsar-hub:latest
            ghcr.io/rokctai/occultation/pulsar-hub:${{ steps.meta.outputs.version }}
          build-args: |
            PULSAR_VERSION=${{ steps.meta.outputs.version }}
            PULSAR_COMMIT=${{ steps.pulsar_src.outputs.core_sha }}

      - name: Build and Push Pulsar Tenant
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pulsar-stage
          file: pulsar-stage/Dockerfile
          target: pulsar-tenant
          build-contexts: sticks-engine=sticks-engine-out
          push: true
          tags: |
            ghcr.io/rokctai/occultation/pulsar-tenant:latest
            ghcr.io/rokctai/occultation/pulsar-tenant:${{ steps.meta.outputs.version }}
          build-args: |
            PULSAR_VERSION=${{ steps.meta.outputs.version }}
            PULSAR_COMMIT=${{ steps.pulsar_src.outputs.core_sha }}

      - name: Build and Push Pulsar Supacharge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pulsar-stage
          file: pulsar-stage/Dockerfile
          target: pulsar-supacharge
          build-contexts: sticks-engine=sticks-engine-out
          push: true
          tags: |
            ghcr.io/rokctai/occultation/pulsar-supacharge:latest
            ghcr.io/rokctai/occultation/pulsar-supacharge:${{ steps.meta.outputs.version }}
          build-args: |
            PULSAR_VERSION=${{ steps.meta.outputs.version }}
            PULSAR_COMMIT=${{ steps.pulsar_src.outputs.core_sha }}

      - name: Build and Push Drone Brain (Pulsar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pulsar-stage
          file: pulsar-stage/Dockerfile
          target: pulsar-drone
          push: true
          tags: |
            ghcr.io/rokctai/occultation/drone-brain:latest
            ghcr.io/rokctai/occultation/drone-brain:${{ steps.meta.outputs.version }}
          build-args: |
            PULSAR_VERSION=${{ steps.meta.outputs.version }}
            PULSAR_COMMIT=${{ steps.pulsar_src.outputs.core_sha }}

      # NOTE: continue-on-error keeps a broken vector/drone-edge build (an external
      # repo) from aborting the release of the hub/tenant/supacharge images above,
      # which are what deploy-master actually ships. A failure here is surfaced as
      # a workflow warning by the step below instead of killing the whole release.
      - name: Build and Push Drone Edge (Go)
        id: drone_edge
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-context/overrides/vector
          file: docker-context/overrides/vector/Dockerfile
          push: true
          tags: |
            ghcr.io/rokctai/occultation/drone-edge:latest
            ghcr.io/rokctai/occultation/drone-edge:${{ steps.meta.outputs.version }}

      - name: Report Drone Edge Build Outcome
        if: steps.drone_edge.outcome == 'failure'
        run: |
          echo "::warning title=Drone Edge image not released::The Drone Edge (RokctAI/vector) image build failed. The drone-edge image was NOT pushed this run, but the hub/tenant/supacharge release and the Master VPS deploy continue regardless. Fix the vector repo build separately."

      - name: Check Database Changes
        id: db-check
        run: |
          DB_CHANGED="true"
          echo "Checking if latest rpanel-db image has PostgreSQL 17 baked in..."
          if docker pull ghcr.io/rokctai/occultation/rpanel-db:latest >/dev/null 2>&1; then
            ENV_VERSION=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' ghcr.io/rokctai/occultation/rpanel-db:latest | grep "PG_MAJOR=" | cut -d= -f2 || true)
            if [ "$ENV_VERSION" = "17" ]; then
              if [ "${{ github.event_name }}" = "push" ]; then
                if ! git diff --name-only HEAD~1 HEAD | grep -qE "platform/postgres.Dockerfile|platform/scripts/db_upgrade_entrypoint.sh"; then
                  DB_CHANGED="false"
                fi
              else
                DB_CHANGED="false"
              fi
            fi
          fi
          echo "db_changed=$DB_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Will rebuild database image: $DB_CHANGED"

      - name: Re-tag and Push existing Database Image
        if: steps.db-check.outputs.db_changed == 'false'
        run: |
          docker tag ghcr.io/rokctai/occultation/rpanel-db:latest ghcr.io/rokctai/occultation/rpanel-db:${{ steps.meta.outputs.version }}
          docker push ghcr.io/rokctai/occultation/rpanel-db:${{ steps.meta.outputs.version }}

      - name: Build and Push Postgres (Custom)
        if: steps.db-check.outputs.db_changed == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-context
          file: docker-context/platform/postgres.Dockerfile
          push: true
          tags: |
            ghcr.io/rokctai/occultation/rpanel-db:latest
            ghcr.io/rokctai/occultation/rpanel-db:${{ steps.meta.outputs.version }}

      - name: Build and Push Gravity
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-context/gravity
          file: docker-context/gravity/Dockerfile
          push: true
          tags: |
            ghcr.io/rokctai/occultation/gravity:latest
            ghcr.io/rokctai/occultation/gravity:${{ steps.meta.outputs.version }}
          build-args: |
            MONOREPO_PAT=${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}

  upgrade-test:
    needs: [pipeline, docker-release]
    # Pulsar blue-green job (needs the shared-workflows PR with the engine input merged first).
    uses: RokctAI/shared-workflows/.github/workflows/universal-upgrade-test.yml@a1ed8107168041aa252213ddcfa5279b00697195 # shared-workflows main @ 2026-11-26
    with:
      current_version: ${{ needs.docker-release.outputs.version }}
      engine: pulsar
      compose_file: docker-compose.pulsar.yml
      hub_package: pulsar-hub
      hub_site: hub.localhost
      pre_deploy_command: 'docker network create rokct_tenants 2>/dev/null || true'
    secrets: inherit

  rollback-images:
    needs: [docker-release, upgrade-test]
    # Only run if images were pushed successfully BUT the upgrade test failed
    if: always() && needs.docker-release.result == 'success' && needs.upgrade-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Failed Images from GHCR
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          VERSION="${{ needs.docker-release.outputs.version }}"
          echo "Rolling back failed version: $VERSION"

          # URL encoded package names.
          # NOTE: rpanel-db is intentionally excluded — it is a shared infrastructure image
          # (Postgres + extensions). It does not change with app code and should never be
          # rolled back. Excluding it ensures rpanel-db:latest always stays valid.
          PACKAGES=("occultation%2Fpulsar-hub" "occultation%2Fpulsar-tenant" "occultation%2Fpulsar-supacharge" "occultation%2Fdrone-brain" "occultation%2Fdrone-edge")

          for PKG in "${PACKAGES[@]}"; do
            echo "Looking up version ID for $PKG tag $VERSION..."
            VERSION_ID=$(curl -s -H "Authorization: token $MONOREPO_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/orgs/RokctAI/packages/container/$PKG/versions" \
              | jq -r ".[] | select(.metadata.container.tags[]? == \"$VERSION\") | .id" | head -n 1)

            if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
              echo "Found ID $VERSION_ID. Issuing delete request..."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: token $MONOREPO_PAT" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/orgs/RokctAI/packages/container/$PKG/versions/$VERSION_ID")
              echo "Delete response code: $RESPONSE"
            else
              echo "Could not find tag $VERSION for package $PKG. It may have already been deleted or not pushed."
            fi
          done

      - name: Restore Previous Version as Latest
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          echo "$MONOREPO_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Restore :latest for app images only by pulling the previous semver tag and
          # re-pushing it as :latest. The GitHub API PATCH on container version metadata
          # does not reliably update GHCR tags — docker pull+retag+push is the safe method.
          #
          # NOTE: rpanel-db is intentionally excluded (see Delete step above).
          PACKAGES=("pulsar-hub" "pulsar-tenant" "pulsar-supacharge" "drone-brain" "drone-edge")
          REGISTRY="ghcr.io/rokctai/occultation"
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for PKG in "${PACKAGES[@]}"; do
            echo "Restoring :latest for $PKG..."

            # Find the most recent remaining semver tag (excluding 'latest') via the API
            PREV_TAG=$(curl -s -H "Authorization: token $MONOREPO_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/$ORG_NAME/packages/container/occultation%2F$PKG/versions" \
              | jq -r '[.[] | select(.metadata.container.tags[] | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].metadata.container.tags[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
              | head -n 1)

            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "null" ]; then
              echo "Re-tagging $REGISTRY/$PKG:$PREV_TAG as :latest..."
              docker pull "$REGISTRY/$PKG:$PREV_TAG"
              docker tag  "$REGISTRY/$PKG:$PREV_TAG" "$REGISTRY/$PKG:latest"
              docker push "$REGISTRY/$PKG:latest"
              echo "✅ $PKG:latest restored from $PREV_TAG"
            else
              echo "⚠️ No semver tag found for $PKG — cannot restore :latest"
            fi
          done

  deploy-master:
    name: "Deploy to Master VPS"
    needs: [docker-release, upgrade-test]
    if: always() && needs.docker-release.result == 'success' && (needs.upgrade-test.result == 'success' || needs.upgrade-test.result == 'skipped') && github.ref_name == 'main'
    runs-on: ubuntu-latest
    # Deliberately NO continue-on-error here: if the deploy cannot run (missing or
    # invalid SSH credentials, unreachable VPS, failed compose pull/up) this job
    # must show RED. A silent no-op deploy is worse than a visible failure.
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Occultation for Config Overrides
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RokctAI/Occultation
          path: overrides/occultation
          token: ${{ secrets.MONOREPO_PAT || github.token }}

      # The VPS host key is learned on the first deploy (ssh-keyscan) and kept in this cache; every later
      # deploy checks it and fails if it changed. Not a secret (a server's public key).
      - name: Restore Master VPS host key
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vps-known-hosts
          key: master-vps-known-hosts-${{ github.run_id }}
          restore-keys: master-vps-known-hosts-

      - name: Configure SSH and Deploy to Master VPS
        env:
          SECRET_SSH_KEY: ${{ secrets.MASTER_VPS_SSH_KEY }}
          SECRET_SSH_HOST: ${{ secrets.MASTER_VPS_HOST }}
          # gravity (gravity-syncer) clones and pushes with the org's MONOREPO_PAT; copied to platform/.env below
          GRAVITY_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          SSH_KEY="$SECRET_SSH_KEY"
          SSH_USER=root
          SSHPASS=""
          SSH_HOST="$SECRET_SSH_HOST"
          
          # Read from .env/production.env inside checked out overrides/occultation if present
          ENV_FILE="overrides/occultation/.env/production.env"
          if [ -f "$ENV_FILE" ]; then
            echo "🔍 Scanning $ENV_FILE for Host and SSH Key credentials..."
            
            FILE_HOST=$(grep -E "^(MASTER_VPS_HOST|CONTROL_VPS_IP|VPS_HOST|VPS_IP)=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d "'\"\r")
            case "$FILE_HOST" in your_*) FILE_HOST="" ;; esac  # template placeholder, not a host
            if [ -n "$FILE_HOST" ]; then
              SSH_HOST="$FILE_HOST"
              echo "✅ Found Host IP in production.env"
            fi
            
            FILE_KEY=$(grep -E "^(MASTER_VPS_SSH_KEY|CONTROL_VPS_SSH_KEY|VPS_SSH_KEY|SSH_KEY)=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d "'\"\r")
            # MASTER_VPS_SSH_KEY_B64: the whole key file as one line of base64 (base64 -w0 <keyfile>); wins when set.
            FILE_KEY_B64=$(grep -E "^MASTER_VPS_SSH_KEY_B64=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d "'\"\r ")
            if [ -n "$FILE_KEY_B64" ]; then
              FILE_KEY=$(printf '%s' "$FILE_KEY_B64" | base64 -d 2>/dev/null || true)
              [ -n "$FILE_KEY" ] || echo "::warning title=Master VPS SSH key::MASTER_VPS_SSH_KEY_B64 is not valid base64."
            fi
            # Only a real private key in the file wins; a placeholder or fingerprint there must
            # not hide a valid MASTER_VPS_SSH_KEY Actions secret.
            if printf '%s' "$FILE_KEY" | grep -q "PRIVATE KEY"; then
              SSH_KEY="$FILE_KEY"
              echo "✅ Found SSH Key in production.env"
            elif [ -n "$FILE_KEY" ]; then
              echo "::warning title=Master VPS SSH key::The SSH key in production.env is not a private key; using the MASTER_VPS_SSH_KEY Actions secret instead."
            fi
            # Password login (Ray's usual way in): MASTER_VPS_USER (default root) + MASTER_VPS_PASSWORD.
            FILE_USER=$(grep -E "^MASTER_VPS_USER=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d "'\"\r ")
            [ -n "$FILE_USER" ] && SSH_USER="$FILE_USER"
            SSHPASS=$(grep -E "^MASTER_VPS_PASSWORD=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | sed "s/\r$//; s/^'\(.*\)'$/\1/; s/^\"\(.*\)\"$/\1/")
            export SSHPASS
            [ -n "$SSHPASS" ] && echo "::add-mask::$SSHPASS"
          fi
          
          # --- Honest gate: missing/invalid credentials FAIL the job loudly. ---
          # (Never print key or host values here — names only.)
          MISSING=""
          if [ -z "$SSH_HOST" ]; then
            MISSING="MASTER_VPS_HOST"
          fi
          if [ -z "$SSH_KEY" ] && [ -z "$SSHPASS" ]; then
            MISSING="${MISSING:+$MISSING and }MASTER_VPS_SSH_KEY_B64 or MASTER_VPS_PASSWORD"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error title=Master VPS deploy cannot run::$MISSING not found in Actions secrets or Occultation .env/production.env. Set the missing value(s) so merges to main actually deploy. This job fails RED on purpose until then."
            exit 1
          fi

          echo "🔐 Setting up SSH connection key..."
          if [ -n "$SSH_KEY" ]; then
            SSH="ssh -o StrictHostKeyChecking=no"
            mkdir -p ~/.ssh
            # Support single-line env-file storage: expand literal \n sequences into newlines.
            printf '%b\n' "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            if ! grep -q "PRIVATE KEY" ~/.ssh/id_rsa; then
              printf '%s\n' "::error title=Master VPS deploy cannot run::MASTER_VPS_SSH_KEY is not valid private key material (no PEM 'PRIVATE KEY' header found). Store the full private key (multiline, or single-line with \\n escapes) in the Actions secret or in Occultation .env/production.env."
              exit 1
            fi
            if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
              echo "::error title=Master VPS deploy cannot run::MASTER_VPS_SSH_KEY is not valid private key material (ssh-keygen could not parse it). Check for truncation, wrong quoting, or a passphrase-protected key."
              exit 1
            fi
          else
            # No key: log in with the password (never printed; sshpass reads it from $SSHPASS).
            sudo apt-get install -y -qq sshpass >/dev/null
            SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no"
            echo "🔑 Using password login for the Master VPS"
          fi
          # Host key: trusted on first use, then checked on every deploy.
          KH="$GITHUB_WORKSPACE/.vps-known-hosts/master"
          mkdir -p "$(dirname "$KH")"
          touch "$KH"
          if ! ssh-keygen -F "$SSH_HOST" -f "$KH" >/dev/null 2>&1; then
            ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null >> "$KH"
            if ! ssh-keygen -F "$SSH_HOST" -f "$KH" >/dev/null 2>&1; then
              echo "::error title=Master VPS host key::Could not read the VPS host key (ssh-keyscan). Is the host reachable on port 22?"
              exit 1
            fi
            echo "🆕 Master VPS host key saved (first deploy to this host); later deploys check it."
          fi
          SSH="${SSH/StrictHostKeyChecking=no/StrictHostKeyChecking=yes -o UserKnownHostsFile=$KH}"

          echo "🚀 Deploying latest Control Plane container to Master VPS..."
          # rokct_tenants is declared external in docker-compose.yml and every
          # tenant compose project, so it must exist before any `up` (idempotent).
          # Hub mail (hub-mail's login and the hub's IGNITION_SMTP_*, PlatformStack#389): copy the SMTP_*
          # lines from Occultation production.env into platform/.env on the server, over
          # stdin so no value appears in a command line or this log. Other keys stay.
          # Also the hub's own passwords, as the old bench build took them from production.env
          # (the old bench build did the same): DB_ROOT_PASSWORD -> DB_PASSWORD (Postgres + hub root), ADMIN_PASSWORD,
          # EMAIL_ENCRYPTION_KEY. Without them the compose falls back to "admin".
          # PLATFORM_DOMAIN (the shared platform every product uses, e.g. platform.rokct.ai) -> SITE_NAME, and
          # TENANT_DOMAIN: moving the platform to another domain is one change in production.env.
          HUB_ENV_KEYS='^(SMTP_(SERVER|PORT|USERNAME|PASSWORD)|DB_ROOT_PASSWORD|ADMIN_PASSWORD|EMAIL_ENCRYPTION_KEY|PLATFORM_DOMAIN|TENANT_DOMAIN)='
          if [ -f "$ENV_FILE" ] && grep -qE "$HUB_ENV_KEYS" "$ENV_FILE"; then
            { grep -E "$HUB_ENV_KEYS" "$ENV_FILE"; [ -n "${GRAVITY_PAT:-}" ] && printf 'MONOREPO_PAT=%s\n' "$GRAVITY_PAT"; true; } | sed 's/\r$//; s/^DB_ROOT_PASSWORD=/DB_PASSWORD=/; s/^PLATFORM_DOMAIN=/SITE_NAME=/' | $SSH "$SSH_USER@$SSH_HOST" \
              "python3 -c 'import sys,os
          p=\"/home/frappe/PlatformStack/platform/.env\"
          new=dict(l.rstrip(\"\\n\").split(\"=\",1) for l in sys.stdin if \"=\" in l)
          old=open(p).read().splitlines() if os.path.exists(p) else []
          keep=[l for l in old if l.split(\"=\",1)[0] not in new]
          os.umask(0o077); open(p,\"w\").write(\"\\n\".join(keep+[k+\"=\"+v for k,v in new.items()])+\"\\n\")
          os.chmod(p,0o600)'"
            echo "✅ Hub SMTP settings and passwords copied (values not shown)"
          else
            echo "::warning title=Hub mail::No SMTP_* in Occultation production.env; the hub will not send mail."
          fi
          # Site-config keys the old bench build put into the hub's site config (build_ecosystem.sh: ovh_*,
          # stripe_*, paystack_*, default_vps_provider) plus the other gateways pay reads (payfast_*, flutterwave_*,
          # paymob_*, paypal_*). They go to platform/site-conf.env as PULSAR_CONF_<KEY>; the hub's entrypoint
          # writes them, lowercased, into its site_config.json on every start, where fx.conf reads them
          # (pay wallet/pulsar/lib/chargers.py, reconcile.py). *_SANDBOX_* keys are CI-only and stay out.
          # Rewritten whole each deploy, over stdin, values never shown.
          SITE_CONF_KEYS='^(OVH_[A-Z_]+|DEFAULT_VPS_PROVIDER|(STRIPE|PAYSTACK|PAYFAST|FLUTTERWAVE|PAYMOB|PAYPAL)_[A-Z_]+)='
          if [ -f "$ENV_FILE" ]; then
            # Values are single-quoted so compose does not interpolate a $ in them; a value that itself holds a
            # single quote is skipped with a warning (name only).
            grep -E "$SITE_CONF_KEYS" "$ENV_FILE" | grep -v '_SANDBOX_' | sed 's/\r$//; s/^PAYFAST_PASSPHRASE=/PAYFAST_PASS_PHRASE=/' \
              | sed -E "s/^([A-Z_]+)=\"(.*)\"$/\\1=\\2/; s/^([A-Z_]+)='(.*)'$/\\1=\\2/" \
              | awk -F= '{ k=$1; v=substr($0, length(k)+2); if (index(v, "\047")) { print "::warning title=Hub site-config::" k " contains a single quote and was skipped" > "/dev/stderr"; next } print "PULSAR_CONF_" k "=\047" v "\047" }' \
              | $SSH "$SSH_USER@$SSH_HOST" "umask 077; cat > /home/frappe/PlatformStack/platform/site-conf.env.tmp && mv /home/frappe/PlatformStack/platform/site-conf.env.tmp /home/frappe/PlatformStack/platform/site-conf.env"
            echo "✅ Hub site-config keys (gateways, OVH) copied (values not shown)"
          fi
          # Next.js sites (platform/sites, PlatformStack sites runner): ship the generated compose, the route list
          # and the ingress scripts that read it, so a site added in sites.json goes live on this deploy.
          tar -C platform -cz docker-compose.yml docker-compose.sites.yml sites/sites.json sites/routes \
            pulsar/ingress juvo-shell | $SSH "$SSH_USER@$SSH_HOST" \
            "mkdir -p /home/frappe/PlatformStack/platform && tar -xz -C /home/frappe/PlatformStack/platform"
          # Token for private site repos (optional): Occultation SITES_GIT_TOKEN, over stdin, never printed.
          SITES_TOKEN=$( [ -f "$ENV_FILE" ] && grep -E '^SITES_GIT_TOKEN=' "$ENV_FILE" | head -1 | cut -d= -f2- || true )
          printf '%s' "$SITES_TOKEN" | $SSH "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > /home/frappe/PlatformStack/platform/sites/.git_token"
          unset SITES_TOKEN
          # Per-site env (Ray, 2026-11-27): Occultation keeps one website block with ${APP_*} placeholders;
          # site_env.py fills them from each site's app block (sites.json "app") and writes
          # sites/<name>.env, used at build time (NEXT_PUBLIC_*) and at run time. Values never printed.
          SITE_ENV_DIR=$(mktemp -d)
          if [ -f "$ENV_FILE" ]; then python3 platform/scripts/site_env.py "$ENV_FILE" "$SITE_ENV_DIR"; else python3 platform/scripts/site_env.py /dev/null "$SITE_ENV_DIR"; fi
          (cd "$SITE_ENV_DIR" && tar -cz -- *.env) | $SSH "$SSH_USER@$SSH_HOST" \
            "umask 077 && mkdir -p /home/frappe/PlatformStack/platform/sites && tar -xz -C /home/frappe/PlatformStack/platform/sites"
          rm -rf "$SITE_ENV_DIR"
          echo "✅ Sites runner files copied ($(grep -vc '^#' platform/sites/routes/routes.list || true) domain(s))"
          $SSH "$SSH_USER@$SSH_HOST" "
            cd /home/frappe/PlatformStack/platform &&
            mkdir -p /etc/nginx/conf.d /etc/letsencrypt /var/www/acme /etc/rokct &&
            printf '%s\\n' '# managed by PlatformStack deploy-master; rokct-ingress owns 80/443' \
              'SERVER_AGENT_NGINX=docker exec rokct-ingress nginx' \
              'SERVER_AGENT_CERTBOT=docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/www/acme:/var/www/acme certbot/certbot:v2.11.0' \
              > /etc/rokct/server-agent.env &&
            chmod 0644 /etc/rokct/server-agent.env &&
            (systemctl try-restart rokct-server-agent 2>/dev/null || true) &&
            (docker network create rokct_tenants 2>/dev/null || true) &&
            docker compose pull &&
            if systemctl list-unit-files exim4.service postfix.service 2>/dev/null | grep -qE '^(exim4|postfix)'; then
              echo 'Host mail server found: stopping it, hub-mail owns ports 25 and 587' &&
              (systemctl disable --now exim4 postfix 2>/dev/null || true)
            fi &&
            docker compose rm -sf hub-mail >/dev/null 2>&1; true &&
            held=\$(ss -Hltnp 'sport = :25 or sport = :587' 2>/dev/null) &&
            if [ -n \"\$held\" ]; then
              echo '::error title=Mail ports busy::Host ports 25/587 are held by another process; hub-mail cannot start:' &&
              echo \"\$held\" && exit 1
            fi &&
            docker compose up -d db &&
            for i in \$(seq 60); do docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done &&
            DBPW=\$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"services\"][\"db\"][\"environment\"][\"POSTGRES_PASSWORD\"])') &&
            printf '%s\\n' \"ALTER USER postgres PASSWORD :'pw';\" | docker compose exec -T db psql -q -U postgres -v pw=\"\$DBPW\" >/dev/null &&
            echo 'Postgres password matches DB_PASSWORD (an existing volume keeps its old one otherwise)' &&
            docker compose up -d
          "
          # Next.js sites (compose profile "sites"): after the hub is up, one build at a time; a failure is a warning.
          $SSH "$SSH_USER@$SSH_HOST" "
            cd /home/frappe/PlatformStack/platform &&
            COMPOSE_PARALLEL_LIMIT=1 docker compose --profile sites up -d --build
          " || echo "::warning title=Sites runner::A Next.js site failed to build or start; the hub deploy is unaffected. See the deploy log."
          echo "✅ Control plane successfully deployed and restarted on Master VPS!"

      - name: Save Master VPS host key
        if: always() && hashFiles('.vps-known-hosts/master') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vps-known-hosts
          key: master-vps-known-hosts-${{ github.run_id }}

  bump-version:
    needs: [docker-release, upgrade-test]
    if: always() && needs.docker-release.result == 'success' && (needs.upgrade-test.result == 'success' || needs.upgrade-test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          
      - name: Auto-Bump Version & Save Build State
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          python3 -c "
          import json, urllib.request, base64, os
          
          # 1. Bump Version
          with open('version.json', 'r') as f:
              data = json.load(f)
          v = data.get('platform')
          if v:
              parts = v.split('.')
              parts[-1] = str(int(parts[-1]) + 1)
              data['platform'] = '.'.join(parts)
              with open('version.json', 'w') as f:
                  json.dump(data, f, indent=4)
                  f.write('\n')

          # 2. Re-fetch and save new Build State
          token = os.environ.get('GITHUB_TOKEN')
          headers = {'Accept': 'application/vnd.github.v3+json'}
          if token: headers['Authorization'] = f'token {token}'

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except: return None

          new_state = {}
          mv_data = fetch('https://api.github.com/repos/RokctAI/control/contents/control/control/major_versions.json')
          if mv_data:
              mv_json = json.loads(base64.b64decode(mv_data['content']).decode())
              for app, config in mv_json.items():
                  repo = f\"{config.get('owner')}/{app}\"
                  if 'rok' in repo.lower() and 'rokct' not in repo.lower(): continue
                  branch = config.get('branch')
                  if branch:
                      res = fetch(f'https://api.github.com/repos/{repo}/commits/{branch}')
                      if res and 'sha' in res: new_state[repo] = res['sha']
                  else:
                      res = fetch(f'https://api.github.com/repos/{repo}/tags')
                      if res and len(res) > 0 and 'name' in res[0]: new_state[repo] = res[0]['name']

          res = fetch('https://api.github.com/repos/RokctAI/PlatformStack/commits/main')
          if res and 'sha' in res: new_state['RokctAI/PlatformStack'] = res['sha']

          res = fetch('https://api.github.com/repos/RokctAI/control/commits/main')
          if res and 'sha' in res: new_state['RokctAI/control'] = res['sha']

          with open('build_state.json', 'w') as f:
              json.dump(new_state, f, indent=4)
              f.write('\n')
          "
          
          git config --global user.name "rokctbot[bot]"
          git config --global user.email "rokctbot[bot]@users.noreply.github.com"
          git add version.json build_state.json
          git commit -m "chore: auto-bump version and update build state [skip ci]" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF#refs/}"

      - name: Trigger Frontend Schema Sync (Repository Dispatch)
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MONOREPO_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RokctAI/RokctAI_frontend/dispatches \
            -d '{"event_type":"schema_updated"}'


  # --- OPT-IN: Composed per-product tenant image (compose-at-build path) ---
  # Never runs on push or schedule: only a manual workflow_dispatch with the
  # `composed-product` input set (e.g. "rcore") triggers it. Completely
  # independent of docker-release — it neither gates nor alters the existing
  # release images, and pushes under its own distinct image name
  # (pulsar-tenant-composed) so nothing existing can accidentally consume it.
  docker-composed:
    if: github.event_name == 'workflow_dispatch' && inputs.composed-product != '' && startsWith(github.repository, 'RokctAI/')
    runs-on: ubuntu-latest
    permissions: write-all
    services:
      db:
        image: pgvector/pgvector:pg16
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_USER: postgres
    steps:
      - name: Install dependencies
        run: |
          { apt-get update && apt-get install -y git rsync; } || { sudo apt-get update && sudo apt-get install -y git rsync; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
           path: docker-context

      - name: Checkout Vector for Overrides
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RokctAI/vector
          path: docker-context/overrides/vector
          token: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT }}

      - name: Build Context Staging
        run: |
          # Copy the current repository's code into the docker context and make
          # sure the overrides dir exists even if the vector checkout was skipped
          # (the Dockerfile COPYs it unconditionally).
          rsync -a --exclude 'docker-context' . ./docker-context/current_repo/
          mkdir -p docker-context/overrides

      - name: Extract Version
        id: meta
        run: |
          if [ -f "docker-context/version.json" ]; then
            VERSION=$(grep -E '"(platform|rpanel)"' docker-context/version.json | head -n 1 | cut -d'"' -f4)
          elif [ -f "docker-context/rpanel/versions.json" ]; then
            VERSION=$(grep '"rpanel"' docker-context/rpanel/versions.json | cut -d'"' -f4)
          else
            VERSION=$(grep "__version__" docker-context/rpanel/__init__.py | cut -d'"' -f2)
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version!"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extract version: $VERSION"

      - name: Confirm Database Readiness
        run: |
          timeout 30s bash -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do echo 'Waiting for PostgreSQL...'; sleep 2; done"

      - name: Checkout Pulsar sources
        id: pulsar_src
        env:
          GIT_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          set -eu
          mkdir -p pulsar-src
          for r in core control pay corporate zones agent hardware productivity commerce designer Users; do
            git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)" \
              clone -q --depth 1 "https://github.com/RokctAI/$r" "pulsar-src/$r" || { [ "$r" = core ] && exit 1; echo "skip $r"; }
          done
          # the core commit goes into the image (PULSAR_COMMIT) so every error names the code it ran
          echo "core_sha=$(git -C pulsar-src/core rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage Pulsar build context
        run: |
          PULSAR_SRC="$PWD/pulsar-src" PULSAR_STAGE_ONLY="$PWD/pulsar-stage" \
            bash docker-context/platform/scripts/build_pulsar_images.sh

      - name: Build and Push Composed Pulsar Tenant
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pulsar-stage
          file: pulsar-stage/Dockerfile
          target: pulsar-tenant-composed
          push: true
          tags: |
            ghcr.io/rokctai/occultation/pulsar-tenant-composed:${{ inputs.composed-product }}
            ghcr.io/rokctai/occultation/pulsar-tenant-composed:${{ inputs.composed-product }}-${{ steps.meta.outputs.version }}
          build-args: |
            PULSAR_PRODUCT=${{ inputs.composed-product }}
            PULSAR_VERSION=${{ steps.meta.outputs.version }}
            PULSAR_COMMIT=${{ steps.pulsar_src.outputs.core_sha }}
