name: Security Scan
env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    permissions:
      contents: read
      actions: read
      security-events: write
      issues: write
      pull-requests: write
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@1941ed0eeedc3aeab408eb6bcd5d58bfa3061e48 # main
    secrets: inherit

