name: Auto Label
env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
on:
  issues:
    types: [opened, edited]

jobs:
  label:
    uses: RokctAI/shared-workflows/.github/workflows/universal-labeler.yml@1941ed0eeedc3aeab408eb6bcd5d58bfa3061e48 # main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
