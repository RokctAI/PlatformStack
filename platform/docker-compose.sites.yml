# GENERATED by platform/scripts/sites.py from platform/sites/sites.json. Do not edit.
# One Next.js site per service, built by the generic shell image; rokct-ingress routes
# each domain in sites/routes/routes.list to site-<name>:3000.
services:
  site-supacharge:
    build:
      context: ./juvo-shell
      args:
        SHELL_REPO: "https://github.com/RokctAI/supacharge-web"
        SHELL_REF: "main"
        NEXT_PUBLIC_SITE_URL: "https://supacharge.school"
      secrets:
        - git_token
    image: "rokct/site-supacharge:main"
    pull_policy: build
    # Started by deploy-master after the hub, one build at a time; a failed site never fails the hub.
    profiles: ["sites"]
    restart: unless-stopped
    env_file:
      - path: ./sites/supacharge.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      rokct_tenants:
        aliases:
          - site-supacharge
    deploy:
      resources:
        limits:
          memory: 512m
