
# RokctAI: Tenant Spoke Template
# This file is used as a template by the Control Hub to spin up isolated tenants.

services:
  db:
    image: ghcr.io/rokctai/occultation/rpanel-db:latest
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=postgres
    volumes:
      - tenant-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M # DB limit for the trial/shared phase
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - tenant-redis-data:/data

  app:
    image: ghcr.io/rokctai/occultation/rpanel-tenant:latest
    # Stable name so the hub can address this tenant without knowing the
    # compose project name (`docker exec <site>-app ...`).
    container_name: ${SITE_NAME}-app
    restart: unless-stopped
    environment:
      - MODE=api
      - SITE_NAME=${SITE_NAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - INSTALL_APPS=${INSTALL_APPS}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - REDIS_CACHE=redis://redis:6379/0
      - REDIS_QUEUE=redis://redis:6379/1
      - REDIS_SOCKETIO=redis://redis:6379/2
      - ROK_API_URL=https://platform.rokct.ai/rok/v1/chat/completions
    volumes:
      - tenant-sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G # Limits the tenant to mimic a small VPS environment
    networks:
      default: {}
      # Joined to the hub's shared bridge under a stable alias so the hub nginx
      # can proxy_pass a tenant's custom backend domain to
      # http://<site_name>-app:8000. No port is published to the host: the
      # tenant stays reachable only from containers on rokct_tenants and from
      # its own project network.
      rokct_tenants:
        aliases:
          - ${SITE_NAME}-app

volumes:
  tenant-db-data:
  tenant-redis-data:
  tenant-sites:

networks:
  # Created once per host by the hub bring-up (`docker network create
  # rokct_tenants`); external so tenant `up`/`down` never creates or removes it.
  rokct_tenants:
    external: true
