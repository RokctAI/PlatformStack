
# RokctAI: Tenant Spoke Template
# This file is used as a template by the Control Hub to spin up isolated tenants.

services:
  db:
    image: ghcr.io/rokctai/occultation/rpanel-db:latest
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=postgres
    volumes:
      - tenant-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M # DB limit for the trial/shared phase
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - tenant-redis-data:/data

  app:
    # Runtime switch. Default is the Ignition image (Pulsar's runner + Frappe
    # v16 + composed rokctapp). Rollback to bench is three variables, set in
    # the tenant's project .env (a ready file: platform/tenant-runtime.bench.env):
    #   TENANT_IMAGE=ghcr.io/rokctai/occultation/rpanel-tenant:latest
    #   TENANT_COMMAND=bench start
    #   TENANT_SITES_PATH=/home/frappe/frappe-bench/sites
    # Pin a release with TENANT_IMAGE=...ignition-tenant:<version>.
    image: ${TENANT_IMAGE:-ghcr.io/rokctai/occultation/ignition-tenant:latest}
    # `tenant` = new-site/migrate, then serve + worker + scheduler in this one
    # container (platform/ignition/tenant.sh). The bench image's own default
    # command is `bench start`, which MODE=api turns into the same three processes.
    command: ${TENANT_COMMAND:-tenant}
    # Stable name so the hub can address this tenant without knowing the
    # compose project name (`docker exec <site>-app ...`).
    container_name: ${SITE_NAME}-app
    restart: unless-stopped
    environment:
      - MODE=api
      - SITE_NAME=${SITE_NAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PULSAR_PROVISION_SECRET=${PULSAR_PROVISION_SECRET:-}
      - INSTALL_APPS=${INSTALL_APPS}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - REDIS_CACHE=redis://redis:6379/0
      - REDIS_QUEUE=redis://redis:6379/1
      - REDIS_SOCKETIO=redis://redis:6379/2
      - ROK_API_URL=https://platform.rokct.ai/rok/v1/chat/completions
      # Ignition image only (the bench image ignores these): superuser that
      # new-site connects as, and its password (the db service's postgres
      # password), plus the admin password.
      - IGNITION_DB_ROOT_USER=postgres
      - IGNITION_DB_ROOT_PASSWORD=${DB_PASSWORD}
      - IGNITION_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - tenant-sites:${TENANT_SITES_PATH:-/opt/ignition/sites}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G # Limits the tenant to mimic a small VPS environment
    networks:
      default: {}
      # Joined to the hub's shared bridge under a stable alias so the hub nginx
      # can proxy_pass a tenant's custom backend domain to
      # http://<site_name>-app:8000. No port is published to the host: the
      # tenant stays reachable only from containers on rokct_tenants and from
      # its own project network.
      rokct_tenants:
        aliases:
          - ${SITE_NAME}-app

volumes:
  tenant-db-data:
  tenant-redis-data:
  tenant-sites:

networks:
  # Created once per host by the hub bring-up (`docker network create
  # rokct_tenants`); external so tenant `up`/`down` never creates or removes it.
  rokct_tenants:
    external: true
