
# RokctAI: Control Hub (Master VPS)
# Manages SSL, Routing, and Shared Trial Pool. The hub runs on the Pulsar engine (no bench, no Frappe).

# Next.js sites (generated from sites/sites.json by scripts/sites.py).
include:
  - docker-compose.sites.yml

services:
  db:
    # Shared Database for Trial Tenants & Control Logic
    image: ghcr.io/rokctai/occultation/rpanel-db:latest
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_USER=postgres
    volumes:
      - control-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - control-redis-data:/data

  app:
    # The hub on the Pulsar engine (platform/pulsar/Dockerfile): no bench, no Frappe, no nginx inside.
    # On first start it makes its control site (PULSAR_SITE) with Pulsar's own new-site, then serves it on 8000.
    # Its Postgres database is p_<site>_<hash>, so it never touches a database an old Frappe hub left in db.
    image: ghcr.io/rokctai/occultation/pulsar-hub:latest
    restart: unless-stopped
    # PULSAR_CONF_* (payment gateways, OVH) written by deploy-master from Occultation production.env;
    # the entrypoint puts them into the site config. Optional so a local `up` works without it.
    env_file: &hub-conf
      - path: site-conf.env
        required: false
    environment: &hub-env
      IGNITION_DB_HOST: db
      IGNITION_DB_PORT: "5432"
      IGNITION_DB_ROOT_USER: postgres
      IGNITION_DB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      IGNITION_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      PULSAR_SITE: ${SITE_NAME:-platform.rokct.ai}
      PULSAR_SITE_EXTRA: '{"app_role": "control", "tenant_domain": "${TENANT_DOMAIN:-rokct.ai}", "tenant_engine": "pulsar", "host_name": "https://${SITE_NAME:-platform.rokct.ai}", "tenants_data_path": "/srv/pulsar/tenants-data"}'
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      # The hub's outgoing mail (verification PINs, staff alerts, the tenant relay) through our mail server
      # (production.env SMTP_*). With no host set Pulsar sends no mail at all.
      IGNITION_SMTP_HOST: ${SMTP_SERVER:-}
      IGNITION_SMTP_PORT: ${SMTP_PORT:-587}
      IGNITION_SMTP_USER: ${SMTP_USERNAME:-}
      IGNITION_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IGNITION_SMTP_SENDER: ${SMTP_USERNAME:-}
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - pulsar-hub-data:/srv/pulsar
    networks:
      - default
      - rokct_tenants
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Pulsar HTTP, localhost only; the public 80/443 go through ingress (nginx).
      - "127.0.0.1:8000:8000"

  app-worker:
    image: ghcr.io/rokctai/occultation/pulsar-hub:latest
    restart: unless-stopped
    env_file: *hub-conf
    command: ["worker"]
    healthcheck: {disable: true}
    environment:
      <<: *hub-env
      IGNITION_SITE: ${SITE_NAME:-platform.rokct.ai}
    volumes:
      - pulsar-hub-data:/srv/pulsar
    depends_on:
      app:
        condition: service_healthy

  app-scheduler:
    image: ghcr.io/rokctai/occultation/pulsar-hub:latest
    restart: unless-stopped
    env_file: *hub-conf
    command: ["scheduler"]
    healthcheck: {disable: true}
    environment:
      <<: *hub-env
      IGNITION_SITE: ${SITE_NAME:-platform.rokct.ai}
    volumes:
      - pulsar-hub-data:/srv/pulsar
    depends_on:
      app:
        condition: service_healthy

  ingress:
    # The one owner of public 80/443 (platform/pulsar/ingress/entrypoint.sh). Serves the hub domain, and every
    # tenant / custom-domain vhost the server agent writes into the host's /etc/nginx/conf.d (the agent reloads it
    # with SERVER_AGENT_NGINX="docker exec rokct-ingress nginx"). On rokct_tenants, so <site>-app:8000 resolves.
    image: nginx:1.27.3-alpine
    container_name: rokct-ingress
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/rokct/entrypoint.sh"]
    environment:
      SITE_NAME: ${SITE_NAME:-platform.rokct.ai}
      HUB_UPSTREAM: http://app:8000
    volumes:
      - ./pulsar/ingress/entrypoint.sh:/rokct/entrypoint.sh:ro
      - ./sites/routes.list:/rokct/routes.list:ro
      - /etc/nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/acme:/var/www/acme:ro
    networks:
      - default
      - rokct_tenants
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy

  hub-cert:
    # Let's Encrypt certificate of the hub domain (webroot through ingress), then renews twice a day. Tenant and
    # custom-domain certificates are the server agent's (issue_cert), in the same /etc/letsencrypt.
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/rokct/hub-cert.sh"]
    environment:
      SITE_NAME: ${SITE_NAME:-platform.rokct.ai}
      MAIL_HOSTNAME: ${SMTP_SERVER:-mail.rokct.ai}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./pulsar/ingress/hub-cert.sh:/rokct/hub-cert.sh:ro
      - ./sites/routes.list:/rokct/routes.list:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/acme:/var/www/acme
    depends_on:
      - ingress

  hub-mail:
    # Our own mail server (Exim4 + DKIM, platform/mail/), run by the hub so any new VPS has mail with no
    # hands-on step. Hub only (tenant composes never have it). The hub sends through it as ${SMTP_SERVER}
    # (alias below), with SMTP AUTH over TLS only. Keeps the old hub's Exim volumes, so the DKIM keys
    # already published in DNS stay the same. Tenant containers cannot reach it (server agent's
    # block_tenant_mail.sh); they send only through the hub's capped relay.
    build:
      context: .
      dockerfile: mail/Dockerfile
    image: rokct/hub-mail:local
    pull_policy: build
    restart: unless-stopped
    environment:
      PRIMARY_HOSTNAME: ${SMTP_SERVER:-mail.rokct.ai}
      SMTP_AUTH_USER: ${SMTP_USERNAME:-}
      SMTP_AUTH_PASS: ${SMTP_PASSWORD:-}
    volumes:
      - control-exim4-config:/etc/exim4
      - control-exim4-spool:/var/spool/exim4
      - control-exim4-logs:/var/log/exim4
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      default:
        aliases:
          - ${SMTP_SERVER:-mail.rokct.ai}
    ports:
      - "25:25"
      - "587:587"

  juvo-shell:
    # The juvo (delivery platform) Next.js shell, hosted on this VPS behind the
    # hub nginx instead of Vercel. Built from RokctAI/delivery-frontend at the
    # pinned ref (see platform/juvo-shell/Dockerfile; generic for any shell that
    # composes from its committed SDK cache). Listens on 3000 on the shared
    # rokct_tenants bridge only - never published to the host; rpanel writes
    # the vhost that proxies a tenant's shell domain to http://juvo-shell:3000.
    build:
      context: ./juvo-shell
      args:
        SHELL_REPO: ${JUVO_SHELL_REPO:-https://github.com/RokctAI/delivery-frontend.git}
        SHELL_REF: ${JUVO_SHELL_REF:-main}
    image: rokct/juvo-shell:${JUVO_SHELL_REF:-main}
    # Locally built only (no registry image): stop `docker compose pull` from
    # trying to pull it; `up` builds it from ./juvo-shell instead.
    pull_policy: build
    restart: unless-stopped
    env_file:
      # Names only in juvo-shell.env.example; copy it to juvo-shell.env (gitignored)
      # and fill the values on the VPS. Optional so `docker compose config`
      # works on a clean checkout.
      - path: ./juvo-shell.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      default: {}
      rokct_tenants:
        aliases:
          - juvo-shell
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      app:
        condition: service_started

  gravity:
    image: ghcr.io/rokctai/occultation/gravity:latest
    container_name: gravity-syncer
    environment:
      - ROKCT_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MONOREPO_PAT=${MONOREPO_PAT}
      - CONTROL_HOST=http://app:8000
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    depends_on:
      app:
        condition: service_started
    volumes:
      - ../..:/workspace
    working_dir: /workspace/Occultation
    command: bash -c "gravity watch & gravity serve --host 0.0.0.0 --port 8000"

volumes:
  pulsar-hub-data:
  # Volumes of the old Frappe hub, kept so their data is not lost (hub-mail mounts the exim4 ones).
  control-db-data:
  control-redis-data:
  control-sites:
  control-logs:
  control-exim4-config:
  control-exim4-spool:
  control-exim4-logs:
  control-opendkim:
  control-nginx-config:
  control-nginx-logs:
  control-cron:
  control-letsencrypt:

networks:
  # Externally managed so it survives `docker compose down` of any single
  # project and can be joined by tenant projects brought up from other
  # directories. Create once per host: `docker network create rokct_tenants`
  # (the Master VPS deploy step in .github/workflows/build.yml does this).
  rokct_tenants:
    external: true
