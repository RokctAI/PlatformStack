
# RokctAI: Control Hub (Master VPS)
# Manages SSL, Routing, and Shared Trial Pool

services:
  db:
    # Shared Database for Trial Tenants & Control Logic
    image: ghcr.io/rokctai/occultation/rpanel-db:latest
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_USER=postgres
    volumes:
      - control-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - control-redis-data:/data

  app:
    # The Orchestrator (Full Stage: Nginx + Exim + Bench)
    image: ghcr.io/rokctai/occultation/rpanel-control:latest
    restart: unless-stopped
    environment:
      - MODE=full
      - SITE_NAME=${SITE_NAME:-platform.rokct.ai}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ROOT_PASSWORD=${DB_PASSWORD:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY}
      - REDIS_CACHE=redis://redis:6379/0
      - REDIS_QUEUE=redis://redis:6379/1
      - REDIS_SOCKETIO=redis://redis:6379/2
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - control-sites:/home/frappe/frappe-bench/sites
      - control-logs:/home/frappe/frappe-bench/logs
      - control-exim4-config:/etc/exim4
      - control-exim4-spool:/var/spool/exim4
      - control-exim4-logs:/var/log/exim4
      - control-opendkim:/etc/opendkim
      - control-nginx-config:/etc/nginx
      - control-nginx-logs:/var/log/nginx
      - control-cron:/etc/cron.d
      # Let's Encrypt state (certs, renewal configs, account keys) issued by
      # rpanel's certbot for tenant backend domains. Must outlive the container.
      - control-letsencrypt:/etc/letsencrypt
      - ../..:/workspace
    networks:
      - default
      # Shared bridge with every tenant compose project so the hub nginx can
      # proxy_pass https://<custom domain> -> http://<site_name>-app:8000.
      - rokct_tenants
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      # Raw bench/gunicorn port: bound to localhost only (in-cluster peers reach
      # it as http://app:8000 over the compose network, not via the host).
      - "127.0.0.1:8000:8000"

  juvo-shell:
    # The juvo (delivery platform) Next.js shell, hosted on this VPS behind the
    # hub nginx instead of Vercel. Built from RokctAI/delivery-frontend at the
    # pinned ref (see platform/juvo-shell/Dockerfile; generic for any shell that
    # composes from its committed SDK cache). Listens on 3000 on the shared
    # rokct_tenants bridge only - never published to the host; rpanel writes
    # the vhost that proxies a tenant's shell domain to http://juvo-shell:3000.
    build:
      context: ./juvo-shell
      args:
        SHELL_REPO: ${JUVO_SHELL_REPO:-https://github.com/RokctAI/delivery-frontend.git}
        SHELL_REF: ${JUVO_SHELL_REF:-main}
    image: rokct/juvo-shell:${JUVO_SHELL_REF:-main}
    restart: unless-stopped
    env_file:
      # Names only in juvo-shell.env.example; copy it to juvo-shell.env (gitignored)
      # and fill the values on the VPS. Optional so `docker compose config`
      # works on a clean checkout.
      - path: ./juvo-shell.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      default: {}
      rokct_tenants:
        aliases:
          - juvo-shell
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      app:
        condition: service_started

  gravity:
    image: ghcr.io/rokctai/occultation/gravity:latest
    container_name: gravity-syncer
    environment:
      - ROKCT_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MONOREPO_PAT=${MONOREPO_PAT}
      - CONTROL_HOST=http://app:8000
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    depends_on:
      app:
        condition: service_started
    volumes:
      - ../..:/workspace
    working_dir: /workspace/Occultation
    command: bash -c "gravity watch & gravity serve --host 0.0.0.0 --port 8000"

volumes:
  control-db-data:
  control-redis-data:
  control-sites:
  control-logs:
  control-exim4-config:
  control-exim4-spool:
  control-exim4-logs:
  control-opendkim:
  control-nginx-config:
  control-nginx-logs:
  control-cron:
  control-letsencrypt:

networks:
  # Externally managed so it survives `docker compose down` of any single
  # project and can be joined by tenant projects brought up from other
  # directories. Create once per host: `docker network create rokct_tenants`
  # (the Master VPS deploy step in .github/workflows/build.yml does this).
  rokct_tenants:
    external: true
